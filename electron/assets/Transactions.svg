     x="512"
     y="540"
     dominant-baseline="central"
     text-anchor="middle"
     font-family="Inter, Segoe UI, system-ui, -apple-system, 'PingFang SC', sans-serif"
     font-size="800"
     font-weight="700"
     fill="#FFFFFF"
     letter-spacing="-8">Tr</text>
</svg>
