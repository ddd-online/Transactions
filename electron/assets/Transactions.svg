<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1024"
   height="1024"
   viewBox="0 0 1024 1024"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Background: DeepSeek blue #3964fe -->
  <rect
     x="0"
     y="0"
     width="1024"
     height="1024"
     rx="200"
     ry="200"
     fill="#3964FE" />
  <!-- Letter Tr: Fills ~75% of icon, centered, Inter-style bold sans, color #FFFFFF -->
