<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎使用 Transactions</title>
  <!-- Vue 本地打包，首启窗口离线可用，避免 CDN 供应链/隐私风险 -->
  <script src="vendor/vue.global.prod.js"></script>
  <style>
    :root {
      --transactions-color-primary: #3964fe;
      --transactions-color-primary-light: #5b7fff;
      --transactions-color-secondary: #61666b;
      --transactions-color-accent: #d97706;
      --transactions-color-positive: #16a34a;
      --transactions-color-negative: #dc2626;
      --transactions-color-major-background: #ffffff;
      --transactions-color-major-warm: #f9fafb;
      --transactions-color-minor-background: #f3f4f6;
      --transactions-color-divider: #eceef1;
      --transactions-color-text-major: #0f1115;
      --transactions-color-text-secondary: #61666b;
      --transactions-color-window-border: #e8eaed;
      --transactions-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --transactions-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --transactions-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.10);
      --transactions-shadow-xl: 0 16px 40px rgba(0, 0, 0, 0.14);
      --transactions-radius-md: 8px;
      --transactions-radius-lg: 12px;
      --transactions-radius-xl: 16px;
      --transactions-transition-fast: 150ms ease;
      --transactions-transition-normal: 200ms ease;
      --transactions-color-hover-bg: rgba(15, 17, 21, 0.06);
    }

    /* 深色外观：跟随系统（nativeTheme.themeSource 驱动 prefers-color-scheme） */
    @media (prefers-color-scheme: dark) {
      :root {
        --transactions-color-primary: #6b8aff;
        --transactions-color-primary-light: #8aa3ff;
        --transactions-color-secondary: #b6bcc6;
        --transactions-color-accent: #fbbf24;
        --transactions-color-positive: #4ade80;
        --transactions-color-negative: #f87171;
        --transactions-color-major-background: #16181d;
        --transactions-color-major-warm: #0f1115;
        --transactions-color-minor-background: #14161a;
        --transactions-color-divider: rgba(255, 255, 255, 0.08);
        --transactions-color-text-major: #f2f4f8;
        --transactions-color-text-secondary: #b6bcc6;
        --transactions-color-window-border: rgba(255, 255, 255, 0.08);
        --transactions-color-hover-bg: rgba(255, 255, 255, 0.08);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--transactions-color-major-warm);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #app {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .welcome-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Left panel - branding */
    .branding-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 72px;
      position: relative;
    }

    .branding-content {
      display: flex;
      flex-direction: column;
      max-width: 400px;
    }

    /* Right panel - action with icon */
    .action-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 64px;
      background: var(--transactions-color-major-background);
      border-left: 1px solid var(--transactions-color-divider);
      position: relative;
      text-align: center;
    }

    .action-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse 100% 80% at 50% 0%, rgba(57, 100, 254, 0.03) 0%, transparent 60%);
      pointer-events: none;
    }


    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-title {
      font-size: 32px;
      font-weight: 600;
      color: var(--transactions-color-text-major);
      margin-bottom: 12px;
      letter-spacing: -1px;
      animation: floatIn 0.8s ease 0.3s both;
    }

    .brand-tagline {
      font-size: 15px;
      color: var(--transactions-color-text-secondary);
      line-height: 1.7;
      max-width: 300px;
      animation: floatIn 0.8s ease 0.4s both;
    }

    .accent-bars {
      display: flex;
      gap: 8px;
      margin-top: 48px;
      animation: floatIn 0.8s ease 0.5s both;
    }

    .accent-bar {
      width: 48px;
      height: 4px;
      border-radius: 2px;
    }

    .accent-bar:nth-child(1) {
      background: var(--transactions-color-primary);
    }

    .accent-bar:nth-child(2) {
      background: var(--transactions-color-negative);
    }

    .accent-bar:nth-child(3) {
      background: var(--transactions-color-accent);
    }

    .accent-bar:nth-child(4) {
      background: var(--transactions-color-secondary);
    }

    /* Primary CTA Button - "开始使用" */
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 36px;
      background: var(--transactions-color-primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: var(--transactions-radius-lg);
      cursor: pointer;
      transition:
        transform var(--transactions-transition-normal),
        box-shadow var(--transactions-transition-normal),
        background var(--transactions-transition-fast);
      box-shadow: var(--transactions-shadow-md);
      opacity: 0;
      animation: fadeIn 0.6s ease 0.6s forwards;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, transparent 50%);
      pointer-events: none;
    }

    .cta-button:hover {
      background: var(--transactions-color-primary-light);
      transform: translateY(-2px);
      box-shadow: var(--transactions-shadow-lg), 0 0 24px rgba(57, 100, 254, 0.15);
    }

    .cta-button:active {
      transform: translateY(0px);
    }

    .cta-button svg {
      transition: transform var(--transactions-transition-normal);
      flex-shrink: 0;
    }

    .cta-button:hover svg {
      transform: translateX(4px);
    }

    /* Workspace path display */
    .workspace-path-box {
      margin-top: 20px;
      padding: 12px 18px;
      background: var(--transactions-color-minor-background);
      border: 1px solid var(--transactions-color-window-border);
      border-radius: var(--transactions-radius-md);
      font-size: 12px;
      color: var(--transactions-color-text-secondary);
      font-family: 'SF Mono', 'Consolas', monospace;
      word-break: break-all;
      max-width: 300px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.8s forwards;
    }

    /* Window controls */
    .window-control {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .window-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      opacity: 0.9;
    }

    .window-btn:hover {
      transform: scale(1.15);
      opacity: 1;
    }

    .window-btn.minimize {
      background: #febc2e;
    }

    .window-btn.maximize {
      background: #28c840;
    }

    .window-btn.close {
      background: #ff5f57;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .welcome-container {
        grid-template-columns: 1fr;
      }

      .branding-panel {
        padding: 60px 40px 40px;
        justify-content: center;
        user-select: none;
        -webkit-app-region: drag;
        pointer-events: auto;
      }

      .branding-content {
        align-items: center;
        text-align: center;
      }

      .brand-tagline {
        text-align: center;
      }

      .action-panel {
        border-left: none;
        border-top: 1px solid var(--transactions-color-divider);
        padding: 48px 32px;
      }

      .accent-bars {
        margin-top: 40px;
      }

      .cta-button {
        padding: 12px 28px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .branding-panel {
        padding: 40px 24px 24px;
      }

      .brand-title {
        font-size: 26px;
      }

      .action-panel {
        padding: 36px 24px;
      }

      .workspace-path-box {
        max-width: 260px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="welcome-container">
      <!-- Left: Branding -->
      <div class="branding-panel">
        <div class="branding-content">
          <h1 class="brand-title">Transactions</h1>

          <div class="accent-bars">
            <div class="accent-bar"></div>
            <div class="accent-bar"></div>
            <div class="accent-bar"></div>
            <div class="accent-bar"></div>
          </div>
        </div>
      </div>

      <!-- Right: Action -->
      <div class="action-panel">
        <button class="cta-button" @click="selectWorkspace">
          开始使用
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>

        <div v-if="workspacePath" class="workspace-path-box">
          {{ workspacePath }}
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const workspacePath = ref('');

        const selectWorkspace = async () => {
          try {
            const result = await window.electronAPI.openDialog({
              properties: ['openDirectory'],
              title: '选择工作目录'
            });

            if (!result.canceled && result.filePaths && result.filePaths.length > 0) {
              workspacePath.value = result.filePaths[0];
              window.electronAPI.initWorkspace(result.filePaths[0]);
            }
          } catch (error) {
            console.error('选择目录失败:', error);
          }
        };

        return {
          workspacePath,
          selectWorkspace
        };
      }
    }).mount('#app');
  </script>
</body>

</html>
